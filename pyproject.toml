[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docs-assistant"
version = "0.1.0"
description = "Ask questions of your documents and get answers with page-level citations"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rahul Pradip Choudhary" }]
keywords = ["rag", "document-qa", "bm25", "retrieval", "fastapi", "citations"]

dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
  "pypdf>=4.2",
  "python-docx>=1.1",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]
anthropic  = ["anthropic>=0.40"]
openai     = ["openai>=1.30"]
dev        = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27", "ruff>=0.6", "reportlab>=4.0"]

[project.scripts]
docs-assistant = "docsassistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
docsassistant = ["web/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]   # FastAPI's File()/Form() defaults are the documented style
